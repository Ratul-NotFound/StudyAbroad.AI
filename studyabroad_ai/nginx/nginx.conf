worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ── Logging ──────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" $request_time';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ── Performance ───────────────────────────────────────────────
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;

    # ── Rate Limiting ─────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=frontend:10m rate=50r/s;

    # ── Upstreams ─────────────────────────────────────────────────
    upstream nextjs_frontend {
        server frontend:3000;
        keepalive 32;
    }

    upstream fastapi_backend {
        server backend:8000;
        keepalive 32;
    }

    upstream scraper_service {
        server scraper:3001;
        keepalive 16;
    }

    # ── Main server block ────────────────────────────────────────
    server {
        listen 80;
        server_name localhost studyabroad.ai www.studyabroad.ai;

        client_max_body_size 50m;

        # ── Security headers ──────────────────────────────────────
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;

        # ── Python FastAPI (/api/v1/* and /docs, /health) ─────────
        location /api/v1/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://fastapi_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
        }

        location /health {
            proxy_pass http://fastapi_backend/health;
            proxy_set_header Host $host;
        }

        location /api/docs {
            proxy_pass http://fastapi_backend/api/docs;
        }

        location /openapi.json {
            proxy_pass http://fastapi_backend/openapi.json;
        }

        # ── Node.js Scraper WebSocket (/scraper/ and /socket.io) ──
        location /scraper/ {
            proxy_pass http://scraper_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /socket.io/ {
            proxy_pass http://scraper_service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400s;
        }

        # ── Next.js frontend (everything else) ────────────────────
        location / {
            limit_req zone=frontend burst=100 nodelay;
            proxy_pass http://nextjs_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # ── Static assets caching ─────────────────────────────────
        location /_next/static/ {
            proxy_pass http://nextjs_frontend;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }
}
