version: "3.9"

# ============================================================
# StudyAbroad.AI — Production Docker Compose
# Services:
#   1. nginx         — Reverse proxy + load balancer (port 80)
#   2. frontend      — Next.js 16 (port 3000)
#   3. backend       — Python FastAPI AI engine (port 8000)
#   4. scraper       — Node.js Puppeteer stealth service (port 3001)
#   5. redis         — Task queue + pub/sub bridge (port 6379)
# ============================================================

networks:
  studyabroad_net:
    driver: bridge

volumes:
  redis_data:
  app_data:

services:

  # ── Redis ─────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: studyabroad_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - studyabroad_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Python FastAPI Backend ─────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: studyabroad_ai/Dockerfile.backend
    container_name: studyabroad_backend
    restart: unless-stopped
    env_file: studyabroad_ai/.env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    volumes:
      - app_data:/app/data
    ports:
      - "8000:8000"
    networks:
      - studyabroad_net
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Node.js Stealth Scraper Service ───────────────────────────
  scraper:
    build:
      context: studyabroad_ai/scraper-service
      dockerfile: Dockerfile
    container_name: studyabroad_scraper
    restart: unless-stopped
    environment:
      - REDIS_URL=redis://redis:6379/0
      - PORT=3001
      - NODE_ENV=production
    ports:
      - "3001:3001"
    networks:
      - studyabroad_net
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Next.js Frontend ──────────────────────────────────────────
  frontend:
    build:
      context: studyabroad_ai/frontend
      dockerfile: Dockerfile
    container_name: studyabroad_frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - BACKEND_URL=http://backend:8000
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_SCRAPER_URL=http://localhost:3001
    ports:
      - "3000:3000"
    networks:
      - studyabroad_net
    depends_on:
      backend:
        condition: service_healthy

  # ── Nginx Reverse Proxy ───────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: studyabroad_nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
      - "443:443"
    networks:
      - studyabroad_net
    depends_on:
      - frontend
      - backend
      - scraper
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
